<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRMTT Compétitions — v4.6 Firebase</title><style>
:root{font-family:system-ui,Segoe UI,Arial;background:#f3f5f8;color:#192638}*{box-sizing:border-box}body{margin:0}header{background:#a01928;color:white;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}header h1{font-size:21px;margin:0}header small{opacity:.85}nav{display:flex;flex-wrap:wrap;gap:5px;padding:10px 15px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}nav button{background:#f4f5f7;color:#344;border:1px solid #ddd}nav button.active{background:#a01928;color:white;border-color:#a01928}button{cursor:pointer;border:0;border-radius:7px;background:#a01928;color:white;padding:9px 12px;font-weight:600}button.secondary{background:#e9edf3;color:#223}button.danger{background:#b42332}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1350px;margin:20px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e0e4ea;border-radius:12px;padding:17px;margin-bottom:16px;box-shadow:0 2px 7px #17263b08}h2{margin:0 0 14px;font-size:20px}h3{margin:8px 0 12px;font-size:16px}p{line-height:1.45}.muted{color:#697586;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{padding:15px;border:1px solid #e2e5ea;border-radius:10px}.metric strong{display:block;font-size:25px;color:#a01928}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0}label{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600}input,select,textarea{font:inherit;border:1px solid #cbd3dd;border-radius:6px;padding:8px;max-width:100%;background:white}input[type=number]{width:90px}input[type=checkbox]{width:17px;height:17px;accent-color:#a01928}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e8ebf0;text-align:left;padding:9px 7px;vertical-align:middle}th{background:#f6f7fa}tr:hover td{background:#fafbfd}.scroll{overflow-x:auto}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:# </style></head><body><header><div><h1>FRMTT · Gestion des compétitions</h1><div style="font-size:13px;font-weight:700;letter-spacing:.03em;margin:5px 0">COMMISSION D’ORGANISATION ET D’ARBITRAGE</div><small>v4.6 — sauvegarde locale et publication Firebase contrôlée</small></div><span id="saveStatus">● Local</span></header><nav id="nav"></nav><main id="app"></main><div class="footer">FRMTT — Gestion des compétitions individuelles de tennis de table · Sauvegarde régulière recommandée</div>
<script>
'use strict';const KEY='frmtt_app_v02';const CATS=['U11 Garçons','U11 Filles','U13 Garçons','U13 Filles','U15 Garçons','U15 Filles','U17 Garçons','U17 Filles','U19 Garçons','U19 Filles','Seniors Hommes','Seniors Dames'];const DEFAULT_POINTS={participation:10,win:20,r16:35,qf:50,sf:65,final:80,champion:100};const tabs=['Tableau de bord','Engagements','Pointage','Poules & tirage','Résultats des poules','Qualifications & tableaux','Points','Exports & sauvegardes','LIVE'];let tab=0;let category='';let club='';let editing=false;let pointageMode="club";let pointageCategory="";let resultPool="all";let liveCategory="";let livePool="all";let liveSection="standings";let poolEditUnlock={};let state=load();const PUBLIC_MODE=new URLSearchParams(location.search).get('live')==='1';let firebaseUser=null,firebaseReady=false,firebaseError='',firebasePublishBusy=false,firebasePublishedAt='',firebasePublicUpdated='',firebasePublicLoaded=false;let autoPublish=localStorage.getItem('frmtt_firebase_auto_publish')==='1';let firebasePublishTimer=null;let firebaseBridge=null;if(PUBLIC_MODE){state=fresh();document.body.classList.add('public-mode');}else repairExtraBracketRounds();
// V3.8 : le LIVE ne doit jamais ajouter de tours aux tableaux officiels.
// Répare les tours surnuméraires créés par l’aperçu V3.4, sans toucher aux résultats valides.
function repairExtraBracketRounds(){
 let repaired=0;
 for(const x of Object.values(state.categories||{})){
  if(!Array.isArray(x.bracket)||!x.bracket.length||!Array.isArray(x.bracket[0]))continue;
  const firstCount=x.bracket[0].length;
  if(!firstCount||!Number.isInteger(Math.log2(firstCount)))continue;
  const expected=Math.log2(firstCount)+1;
  if(x.bracket.length<=expected)continue;
  // Les tours créés par erreur n'ont ni gagnant ni score : ne jamais effacer un résultat réel.
  const extras=x.bracket.slice(expected);
  if(!extras.every(round=>Array.isArray(round)&&round.every(m=>!m.winner&&m.loserSets==null)))continue;
  x.bracket=x.bracket.slice(0,expected);
  repaired++;
 }
 if(repaired){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Sauvegarde réparation impossible',e)}}
}
function fresh(){return {meta:{name:'Étape régionale — simulation',date:'2026-11-08',place:'Casablanca',zone:'Sud'},players:[],clubs:{},categories:{},pointsEnabled:true,points:{...DEFAULT_POINTS},audit:[],created:new Date().toISOString()}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.players))return s}catch(e){}return fresh()}
function repairDuplicatedNames(){let count=0;for(let p of state.players){let a=String(p.first||'').trim(),b=String(p.last||'').trim();if(a&&b&&a.toLocaleLowerCase('fr')===b.toLocaleLowerCase('fr')){p.first=a;p.last='';count++}}return count}
function repairNamesNow(){let n=repairDuplicatedNames();if(n){save('Réparation non destructive de '+n+' noms dupliqués');render()}alert(n?n+' fiches corrigées. Les licences, présences et poules ont été conservées.':'Aucun nom dupliqué détecté.')}
function save(reason){if(PUBLIC_MODE)return;if(reason)state.audit.unshift({at:new Date().toISOString(),text:reason});state.audit=state.audit.slice(0,400);try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='● Sauvegardé '+new Date().toLocaleTimeString('fr-FR')}catch(e){alert('Stockage local saturé : exportez votre sauvegarde JSON.')}if(autoPublish&&firebaseUser&&firebaseBridge)scheduleFirebasePublish();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Math.random().toString(36).slice(2,10)}function byId(x){return state.players.find(p=>p.id===x)}function name(p){if(!p)return '—';let a=String(p.first||'').trim(),b=String(p.last||'').trim();return a&&b&&a.toLocaleLowerCase('fr')===b.toLocaleLowerCase('fr')?a:[a,b].filter(Boolean).join(' ')||'—'}function playerLabel(p){return p?name(p)+' · '+(p.pl||'PL ?')+' · '+(p.club||'Club ?'):'—'}function playerCard(p){return p?'<strong>'+esc(name(p))+'</strong><div class="tiny">'+esc(p.pl||'PL ?')+' · '+esc(p.club||'Club ?')+'</div>':'—'}function active(p){return !!state.clubs[p.club]?.confirmed&&p.present!==false}function normCat(v){return String(v||'').normalize('NFKC').replace(/\s+/g,' ').trim().toLocaleLowerCase('fr')}function present(cat){return state.players.filter(p=>normCat(p.category)===normCat(cat)&&active(p))}function hasCategoryWork(c){const x=state.categories[c];return !!(x&&(x.validated||x.qualValidated||(Array.isArray(x.pools)&&x.pools.some(p=>Array.isArray(p)&&p.some(Boolean)))||(Array.isArray(x.matches)&&x.matches.some(m=>m.winner))||(Array.isArray(x.bracket)&&x.bracket.some(r=>Array.isArray(r)&&r.some(m=>m.winner)))))}
function cats(){let vals=[...state.players.filter(active).map(p=>p.category),...Object.keys(state.categories).filter(hasCategoryWork)].filter(Boolean),m=new Map();for(let c of vals){let k=normCat(c);if(!m.has(k))m.set(k,CATS.find(x=>normCat(x)===k)||c)}return [...m.values()].sort((a,b)=>{let i=CATS.indexOf(a),j=CATS.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b,'fr')})}
function config(cat){let x=state.categories[cat];if(!x||typeof x!=='object'){x={};state.categories[cat]=x}if(!Array.isArray(x.pools))x.pools=[];if(!Array.isArray(x.matches))x.matches=[];if(!Array.isArray(x.bracket))x.bracket=[];if(!Array.isArray(x.seeds))x.seeds=[];if(!Array.isArray(x.poolSizes))x.poolSizes=[];if(!Number.isInteger(x.poolCount)||x.poolCount<0)x.poolCount=x.pools.length;if(x.poolCount!==x.pools.length&&x.pools.length)x.poolCount=x.pools.length;if(!Number.isInteger(x.qualify)||x.qualify<1)x.qualify=2;if(!['auto','manual','hybrid'].includes(x.mode))x.mode='auto';return x}function isSinglePool(x){return x.poolCount===1||x.pools.length===1}
function hasRecordedResults(x){return Array.isArray(x.matches)&&x.matches.some(m=>!!m.winner)}
function reconcileDraftCategory(cat){
 const x=config(cat);
 // A match schedule without any winner is not evidence that competition has started.
 // Never delete a scored match, even if its draft flag is inconsistent.
 if(!x.validated&&!hasRecordedResults(x)&&x.matches.length){x.matches=[];x.bracket=[];}
 return x;
}
function allClubs(){return [...new Set(state.players.map(p=>p.club))].filter(Boolean).sort()}function badge(x){return `<span class="pill ${x?'green':''}">${x?'Confirmé':'À pointer'}</span>`}function goto(t){tab=t;if([0,3,4,5,6,7,8].includes(t)&&!cats().includes(category))category=cats()[0]||'';render()}function selCat(){if(!cats().includes(category))category=cats()[0]||'';return `<label>Catégorie <select id="categorySelect" onchange="category=this.value;render()">${cats().map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select></label>`}
function render(){if(PUBLIC_MODE){renderPublicLive();return}document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="goto(${i})">${t}</button>`).join('');try{let html=[dashboard,engagements,pointage,poolsView,resultsView,bracketView,pointsView,exportView,liveView][tab]();document.getElementById('app').innerHTML=html;}catch(err){console.error('Erreur affichage FRMTT',err);document.getElementById('app').innerHTML='<section class="panel"><h2>Erreur d’affichage</h2><p>Une donnée de cette rubrique semble incompatible. Vos engagements et pointages n’ont pas été supprimés.</p><p class="bad">'+esc(err.message)+'</p><button onclick="goto(7)">Exports et sauvegardes</button> <button class="secondary" onclick="goto(0)">Tableau de bord</button></section>'}}
function dashboard(){let cs=allClubs(),confirmed=cs.filter(c=>state.clubs[c]?.confirmed).length,pm=state.players.filter(active).length,match=Object.values(state.categories).flatMap(c=>c.matches||[]),done=match.filter(m=>m.winner).length;return `<section class="panel"><h2>Compétition</h2><div class="row"><label>Nom <input id="metaName" value="${esc(state.meta.name)}"></label><label>Date <input id="metaDate" type="date" value="${esc(state.meta.date)}"></label><label>Lieu <input id="metaPlace" value="${esc(state.meta.place)}"></label><label>Zone <select id="metaZone"><option ${state.meta.zone==='Sud'?'selected':''}>Sud</option><option ${state.meta.zone==='Nord'?'selected':''}>Nord</option><option ${state.meta.zone==='Nationale'?'selected':''}>Nationale</option></select></label><button onclick="saveMeta()">Enregistrer</button></div></section><section class="panel"><h2>Nouveau tournoi</h2><p class="muted">Démarrer une nouvelle compétition en effaçant les données locales du tournoi actuel. Sauvegarde JSON fortement recommandée avant toute réinitialisation.</p><div class="row"><button class="secondary" onclick="backupCurrentTournament()">Télécharger la sauvegarde JSON</button><button class="danger" onclick="startNewTournament()">Nouveau tournoi / Réinitialiser</button></div></section><section class="panel"><h2>Vue générale</h2><div class="grid"><div class="metric"><strong>${state.players.length}</strong>Engagés</div><div class="metric"><strong>${pm}</strong>Présents confirmés</div><div class="metric"><strong>${confirmed}/${cs.length}</strong>Clubs pointés</div><div class="metric"><strong>${cats().length}</strong>Catégories</div><div class="metric"><strong>${done}/${match.length}</strong>Matchs de poule saisis</div></div></section><section class="panel"><h2>Avancement par catégorie</h2><div class="scroll"><table><tr><th>Catégorie</th><th>Présents</th><th>Poules</th><th>Matchs de poule</th><th>Qualifications</th><th>Accès</th></tr>${cats().map(c=>{let x=config(c);return `<tr><td>${esc(c)}</td><td>${present(c).length}</td><td>${x.pools.length}</td><td>${x.matches.filter(m=>m.winner).length}/${x.matches.length}</td><td>${isSinglePool(x)?'Classement direct':badge(x.qualValidated)}</td><td><button class="secondary" onclick="category=${JSON.stringify(c)};goto(3)">Ouvrir</button></td></tr>`}).join('')}</table></div></section><section class="panel"><h2>Dernières opérations</h2>${state.audit.slice(0,8).map(a=>`<p class="muted">${new Date(a.at).toLocaleString('fr-FR')} — ${esc(a.text)}</p>`).join('')||'<p class="muted">Aucune opération.</p>'}</section>`}
function saveMeta(){state.meta={name:document.getElementById('metaName').value,date:document.getElementById('metaDate').value,place:document.getElementById('metaPlace').value,zone:document.getElementById('metaZone').value};save('Paramètres de compétition modifiés');render()}
function engagements(){return `<section class="panel"><h2>Engagements</h2><div class="row"><button class="secondary" onclick="repairNamesNow()">Corriger les noms dupliqués existants</button></div><p class="muted">Importer un CSV UTF-8 avec Zone (facultatif), Club, Catégorie, N° PL et soit Nom + Prénom en deux colonnes, soit « Nom Prénom » dans une seule colonne (séparateur ; ou ,). En colonne combinée, le premier mot est interprété comme prénom : vérifiez les noms composés. Pour Excel .xlsx, enregistrer d'abord en CSV. L'import ajoute les joueurs et ignore les licences déjà présentes.</p><div class="row"><input type="file" id="csv" accept=".csv,.txt"><button onclick="importCSV()">Importer CSV</button><button class="secondary" onclick="sampleCSV()">Télécharger modèle CSV</button><button class="danger" onclick="clearEngagements()" ${state.players.length?'':'disabled'}>Supprimer tous les engagements</button></div><p class="muted">En cas d’erreur d’import, supprimez les engagements puis importez le bon fichier. Une confirmation est demandée.</p><h3>Ajouter un joueur</h3><div class="row"><input id="pClub" placeholder="Club (ex. WAC)" style="width:110px"><select id="pCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="pPL" placeholder="PL..." style="width:100px"><input id="pFirst" placeholder="Prénom" style="width:140px"><input id="pLast" placeholder="Nom" style="width:140px"><button onclick="addPlayer()">Ajouter</button></div></section>${licenseAudit()}<section class="panel"><h2>Liste des engagés (${state.players.length})</h2><div class="row"><input id="filter" placeholder="Rechercher nom, licence, club..." oninput="filterRows(this.value)"></div><div class="scroll"><table id="playersTable"><tr><th>Club</th><th>Catégorie</th><th>Licence</th><th>Prénom</th><th>Nom</th><th>Présence</th><th>Actions</th></tr>${state.players.map(p=>`<tr data-search="${esc([p.club,p.category,p.pl,p.first,p.last].join(' ').toLowerCase())}"><td>${esc(p.club)}</td><td>${esc(p.category)}</td><td>${esc(p.pl)}</td><td>${esc(p.first)}</td><td>${esc(p.last)}</td><td>${active(p)?'Présent confirmé':(p.present===false?'Absent':'Non confirmé')}</td><td><button class="secondary" onclick="editPlayer('${p.id}')">Modifier</button> <button class="danger" onclick="removePlayer('${p.id}')">Retirer</button></td></tr>`).join('')}</table></div></section>`}
function normalizedLicense(v){return String(v||'').normalize('NFKC').toUpperCase().replace(/[\s.\-_]/g,'')}
function provisionalLicense(v){let n=normalizedLicense(v);return !n||['ENCOURS','PLENCOURS','ENC','ATTENTE','PL?','?'].includes(n)}
function licenseConflicts(){let groups=new Map(),alerts=[];for(let p of state.players){let k=normalizedLicense(p.pl);if(provisionalLicense(k))continue;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}for(let [k,ps] of groups)if(ps.length>1)alerts.push({k,ps});return alerts}
function licenseAudit(){let conflicts=licenseConflicts(),html=conflicts.map(g=>`<li><b>${esc(g.k)}</b> : ${g.ps.map(p=>esc(playerLabel(p))).join(' / ')}</li>`).join('');let possible=[];let byName=new Map();for(let p of state.players){let k=normCat(name(p));if(!byName.has(k))byName.set(k,[]);byName.get(k).push(p)}for(let [k,ps] of byName)if(ps.length>1&&new Set(ps.map(p=>normalizedLicense(p.pl))).size>1)possible.push(ps);return `<section class="panel"><h2>Contrôle des licences</h2><div class="row"><button class="secondary" onclick="alert(licenseConflicts().length?'Conflits détectés : '+licenseConflicts().length:'Aucun conflit de numéro de licence détecté.');render()">Vérifier les licences</button><span class="pill ${conflicts.length?'red':'green'}">${conflicts.length} conflit(s) de licence</span></div>${conflicts.length?`<p class="bad">Corriger les licences en conflit avant de valider le tirage.</p><ul>${html}</ul>`:'<p class="muted">Aucun numéro de licence en conflit.</p>'}${possible.length?`<p class="note">Noms identiques avec licences différentes à vérifier : ${possible.map(ps=>ps.map(p=>esc(playerLabel(p))).join(' / ')).join(' ; ')}</p>`:''}<p class="muted">Les licences « EN COURS » ou vides ne sont pas considérées comme des identifiants uniques.</p></section>`}
function filterRows(s){document.querySelectorAll('#playersTable tr[data-search]').forEach(tr=>tr.style.display=tr.dataset.search.includes(s.toLowerCase())?'':'none')}
function addPlayer(){let p={id:id(),club:document.getElementById('pClub').value.trim().toUpperCase(),category:document.getElementById('pCat').value,pl:document.getElementById('pPL').value.trim().toUpperCase(),first:document.getElementById('pFirst').value.trim(),last:document.getElementById('pLast').value.trim(),present:true};if(!p.club||!p.first||!p.last||!p.pl)return alert('Club, licence, prénom et nom requis.');if(!provisionalLicense(p.pl)&&state.players.some(q=>normalizedLicense(q.pl)===normalizedLicense(p.pl)))return alert('Conflit : cette licence est déjà utilisée par '+playerLabel(state.players.find(q=>normalizedLicense(q.pl)===normalizedLicense(p.pl))));state.players.push(p);state.clubs[p.club]={confirmed:false};save('Ajout joueur '+name(p));render()}
function playerUsed(pid){return Object.values(state.categories).some(c=>(c.matches||[]).some(m=>m.a===pid||m.b===pid)||(c.pools||[]).some(pool=>pool.includes(pid))||(c.bracket||[]).some(round=>round.some(m=>m.winner===pid||m.a?.pid===pid||m.b?.pid===pid)))}
function editPlayer(pid){let p=byId(pid);if(!p)return;let old={...p};let club=prompt('Club',p.club);if(club===null)return;let category=prompt('Catégorie (ex. U15 Garçons)',p.category);if(category===null)return;let pl=prompt('Numéro de licence PL',p.pl);if(pl===null)return;let first=prompt('Prénom',p.first);if(first===null)return;let last=prompt('Nom',p.last);if(last===null)return;club=club.trim().toUpperCase();category=category.trim();pl=pl.trim().toUpperCase();first=first.trim();last=last.trim();if(!club||!category||!pl||!first||!last)return alert('Tous les champs sont obligatoires.');if(state.players.some(q=>q.id!==pid&&!provisionalLicense(pl)&&normalizedLicense(q.pl)===normalizedLicense(pl)))return alert('Cette licence est déjà utilisée.');if(category!==old.category&&playerUsed(pid))return alert('Ce joueur est déjà affecté à une poule ou un tableau. Le changement de catégorie est bloqué pour protéger les résultats.');if(club!==old.club&&playerUsed(pid)&&!confirm('Le joueur est déjà dans une poule. Changer son club peut affecter la répartition sportive. Confirmer ?'))return;Object.assign(p,{club,category,pl,first,last});if(club!==old.club){state.clubs[club]={confirmed:false};if(state.clubs[old.club])state.clubs[old.club].confirmed=false}if(category!==old.category&&state.clubs[club])state.clubs[club].confirmed=false;save('Modification joueur '+old.pl+' : '+JSON.stringify({avant:old,apres:{club,category,pl,first,last}}));render()}

function parseCSV(text){
 let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(s=>s.trim());
 if(!lines.length)throw Error('Le fichier CSV est vide.');
 let sep=[';',',','\t'].sort((a,b)=>(lines[0].split(b).length-lines[0].split(a).length))[0];
 let split=line=>{let arr=[],v='',quoted=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){arr.push(v.trim());v=''}else v+=c}arr.push(v.trim());return arr};
 let norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\bn[°º]\s*/g,'numero ').replace(/\bn[o]\s+(?=pl|licence)/g,'numero ').replace(/[_\-.:/]+/g,' ').replace(/\s+/g,' ').trim();
 let head=split(lines.shift()).map(norm);
 let col=(...terms)=>head.findIndex(h=>terms.some(t=>h===t));
 let zoneIdx=col('zone','region'),clubIdx=col('club','association'),catIdx=col('categorie','category'),plIdx=col('pl','licence','license','n licence','numero licence','numero pl','numero de pl','numero de licence','num pl','n pl');
 let firstIdx=col('prenom','first','first name'),lastIdx=col('nom','last','last name','nom de famille');
 let fullIdx=col('nom prenom','nom et prenom','prenom nom','prenom et nom','nom complet','joueur','joueuse','nom/prenom','nom & prenom');
 if(clubIdx<0||catIdx<0||plIdx<0)throw Error('Colonnes obligatoires manquantes : Club, Catégorie et N° PL. En-têtes détectés : '+head.join(' | '));
 if((firstIdx<0||lastIdx<0)&&fullIdx<0)throw Error('Ajoutez soit deux colonnes Nom et Prénom, soit une seule colonne Nom Prénom.');
 return lines.map(l=>{let x=split(l),first='',last='';
  if(firstIdx>=0&&lastIdx>=0){first=x[firstIdx]||'';last=x[lastIdx]||''}
  else{let full=(x[fullIdx]||'').trim().replace(/\s+/g,' ');let parts=full.split(' ');first=parts.shift()||'';last=parts.join(' ')}
  return {zone:zoneIdx>=0?(x[zoneIdx]||'').trim().toUpperCase():'',club:(x[clubIdx]||'').trim().toUpperCase(),category:(CATS.find(c=>normCat(c)===normCat(x[catIdx]))||(x[catIdx]||'').trim().replace(/\s+/g,' ')),pl:(x[plIdx]||'').trim().toUpperCase(),first:first.trim(),last:last.trim()}
 });
}

function standings(cat,poolIndex){let x=config(cat),pool=x.pools[poolIndex]||[],matches=x.matches.filter(m=>m.pool===poolIndex),rows=pool.map(pid=>({pid,win:0,loss:0,sw:0,sl:0,pw:0,pl:0,pointsComplete:true}));for(let m of matches.filter(m=>m.winner)){let a=rows.find(r=>r.pid===m.a),b=rows.find(r=>r.pid===m.b),w=m.winner===m.a?a:b,l=w===a?b:a;w.win++;l.loss++;w.sw+=3;w.sl+=m.wo?0:m.loserSets;l.sw+=m.wo?0:m.loserSets;l.sl+=3;if(!m.wo){if(m.sets){for(let s of m.sets){a.pw+=s[0];a.pl+=s[1];b.pw+=s[1];b.pl+=s[0]}}else{a.pointsComplete=false;b.pointsComplete=false}}}let unresolved=false,explanations=[];function ratio(a,b){return b===0?(a===0?0:Infinity):a/b}function rank(group,level=0){if(group.length<2||level>8)return group;let set=new Set(group.map(r=>r.pid)),sub=matches.filter(m=>m.winner&&set.has(m.a)&&set.has(m.b));let stats=new Map(group.map(r=>[r.pid,{wins:0,losses:0,sw:0,sl:0,pw:0,pl:0,complete:true}]));for(let m of sub){let a=stats.get(m.a),b=stats.get(m.b),w=stats.get(m.winner),l=stats.get(m.winner===m.a?m.b:m.a);w.wins++;l.losses++;w.sw+=3;w.sl+=m.wo?0:m.loserSets;l.sw+=m.wo?0:m.loserSets;l.sl+=3;if(!m.wo){if(m.sets){m.sets.forEach(s=>{a.pw+=s[0];a.pl+=s[1];b.pw+=s[1];b.pl+=s[0]})}else{a.complete=false;b.complete=false}}}let metrics=[r=>ratio(stats.get(r.pid).wins,stats.get(r.pid).losses),r=>ratio(stats.get(r.pid).sw,stats.get(r.pid).sl),r=>stats.get(r.pid).complete?ratio(stats.get(r.pid).pw,stats.get(r.pid).pl):null];function splitBy(arr,idx){if(idx===3){unresolved=true;explanations.push('Égalité non résolue : vérifier les points de sets et la règle réglementaire.');return arr}let values=arr.map(r=>metrics[idx](r));if(values.some(v=>v===null)){unresolved=true;explanations.push('Points de sets manquants pour départager '+arr.map(r=>name(byId(r.pid))).join(', '));return arr}let distinct=[...new Set(values)].sort((a,b)=>b-a);if(distinct.length===1)return splitBy(arr,idx+1);explanations.push(`Départage de ${arr.length} joueurs : ${['rapport victoires/défaites','ra function standingsHTML(cat,i){let s=standings(cat,i),x=config(cat);return `<div class="scroll"><table><tr><th>Rang*</th><th>Joueur</th><th>Licence</th><th>Club</th><th>J</th><th>V</th><th>D</th><th>Diff. V/D</th><th>Sets +</th><th>Sets −</th><th>Diff. sets</th><th>Points +</th><th>Points −</th><th>Diff. points</th><th>Statut</th></tr>${s.rows.map((r,j)=>`<tr><td>${s.rows.every(z=>z.win+z.loss===0)?"—":j+1}</td><td>${liveIdentity(byId(r.pid))}</td><td>${esc(byId(r.pid)?.pl||"—")}</td><td>${esc(byId(r.pid)?.club||"—")}</td><td>${playedMatchesForPlayer(cat,i,r.pid)}</td><td>${r.win}</td><td>${r.loss}</td><td>${r.win-r.loss>0?"+":""}${r.win-r.loss}</td><td>${r.sw}</td><td>${r.sl}</td><td>${r.sw-r.sl>0?'+':''}${r.sw-r.sl}</td><td>${r.pointsComplete?r.pw:'—'}</td><td>${r.pointsComplete?r.pl:'—'}</td><td>${r.pointsComplete?(r.pw-r.pl>0?'+':'')+(r.pw-r.pl):'—'}</td><td>${isSinglePool(x)?(s.complete&&!s.unresolved?'<span class="pill green">Rang final</span>':'<span class="pill">Rang provisoire</span>'):(s.complete&&!s.unresolved&&x.qualValidated?(j<x.qualify?'<span class="pill green">Qualifié</span>':'Non qualifié'):(s.complete&&!s.unresolved?'Classement terminé · validation en attente':'En attente'))}</td></tr>`).join('')}</table></div><p class="muted">*Classement ${s.complete?'calculé':'provisoire'}. ${s.unresolved?'<span class="bad">Départage non résolu.</span>':''} ${s.explanations.map(esc).join(' ')}</p>`}

function bracketPlacementWarnings(cat){

function download(filename,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(){let rows=[['Club','Catégorie','Licence','Prénom','Nom','Présent confirmé'],...state.players.map(p=>[p.club,p.category,p.pl,p.first,p.last,active(p)?'Oui':'Non'])];download('frmtt_engagements.csv','\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}

function restore(){let f=document.getElementById('backup').files[0];if(!f)return alert('Sélectionnez un fichier JSON.');f.text().then(t=>{try{let s=JSON.parse(t);if(!Array.isArray(s.players)||!s.categories||!s.meta||!s.clubs)throw Error('Structure invalide.');if(!confirm('Remplacer toutes les données locales par cette sauvegarde ?'))return;state=s;save('Sauvegarde restaurée');render()}catch(e){alert('Restauration impossible : '+e.message)}})}function backupCurrentTournament(){

 category='';club='';editing=false;pointageMode='club';pointageCategory='';resultPool='all';liveCategory='';livePool='all';liveSection='standings';poolEditUnlock={};tab=0;

function playedMatchesForPlayer(cat,poolIndex,pid){return config(cat).matches.filter(m=>m.pool===poolIndex&&m.winner&&!m.wo&&(m.a===pid||m.b===pid)).length}
function liveIdentity(p){if(!p)return '<span>En attente</span>';return `<span class="live-player"><span class="live-player-name">${esc(name(p))}</span><small>${esc(p.pl||'Licence non renseignée')} · ${esc(p.club||'Club non renseigné')}</small></span>`}
function livePreview(){
 const available=cats().filter(c=>config(c).validated&&config(c).pools.length);
 if(!available.length)return '<p class="muted">Validez les poules pour prévisualiser le LIVE.</p>';
 const cat=available.includes(liveCategory)?liveCategory:available.includes(category)?category:available[0];
 liveCategory=cat;
 const x=config(cat);
 if(livePool!=="all"&&(!Number.isInteger(Number(livePool))||Number(livePool)<0||Number(livePool)>=x.pools.length))livePool="all";
 const chooser=`<div class="row" style="align-items:end;gap:10px;flex-wrap:wrap"><label>Catégorie <select onchange="liveCategory=this.value;livePool='all';render()">${available.map(c=>`<option value="${esc(c)}" ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Affichage <select onchange="liveSection=this.value;render()"><option value="standings" ${liveSection==='standings'?'selected':''}>Classement des poules</option><option value="matches" ${liveSection==='matches'?'selected':''}>Matchs des poules</option><option value="bracket" ${liveSection==='bracket'?'selected':''}>Tableau final</option></select></label>${liveSection!=='bracket'?`<label>Poule <select onchange="livePool=this.value;render()"><option value="all" ${livePool==='all'?'selected':''}>Toutes les poules</option>${x.pools.map((_,i)=>`<option value="${i}" ${String(i)===livePool?'selected':''}>Poule ${i+1}</option>`).join('')}</select></label>`:''}</div>`;
 const selected=x.pools.map((pool,i)=>({pool,i})).filter(({i})=>livePool==='all'||String(i)===livePool);
 const pools=`<div style="max-width:510px;border:1px solid #ddd;border-radius:12px;padding:12px"><h3>${esc(cat)} — Poules</h3>${selected.map(({pool,i})=>{const st=standings(cat,i),matches=x.matches.filter(m=>m.pool===i),played=matches.filter(m=>m.winner).length,confirmed=st.complete&&!st.unresolved&&x.qualValidated;return `<h4>Poule ${i+1} · ${played}/${matches.length} matchs</h4><div class="scroll"><table><tr><th>Rang</th><th>Joueur</th><th>J</th><th>V</th><th>D</th><th>Diff. V/D</th><th>Statut</th></tr>${st.rows.map((r,j)=>`<tr><td>${played?j+1:'—'}</td><td>${liveIdentity(byId(r.pid))}</td><td>${playedMatchesForPlayer(cat,i,r.pid)}</td><td>${r.win}</td><td>${r.loss}</td><td>${r.win-r.loss>0?'+':''}${r.win-r.loss}</td><td>${confirmed?(j<x.qualify?'<span class="pill green">Qualifié</span>':'Non qualifié'):(st.complete&&!st.unresolved?'Validation en attente':'—')}</td></tr>`).join('')}</table></div>`}).join('')}</div>`;
 const matchList=`<div style="max-width:510px;border:1px solid #ddd;border-radius:12px;padding:12px"><h3>${esc(cat)} — Matchs des poules</h3>${selected.map(({i})=>{let ms=x.matches.filter(m=>m.pool===i),done=ms.filter(m=>m.winner).length;return `<h4>Poule ${i+1} · ${done}/${ms.length} matchs</h4>${ms.length?ms.map((m,j)=>{let pa=byId(m.a),pb=byId(m.b),completed=Boolean(m.winner);let aWin=m.winner===m.a,bWin=m.winner===m.b;return `<div style="border:1px solid #d8dfe8;border-radius:8px;padding:9px;margin-bottom:8px"><div class="tiny">Match ${j+1} · ${completed?'Terminé':'En attente'}</div><div style="display:flex;justify-content:space-between"><span style="${aWin?'font-weight:700;color:#087543':''}">${liveIdentity(pa)}</span><strong>${completed?(aWin?'3':m.wo?'0':String(m.loserSets)):'—'}</strong></div><div style="display:flex;justify-content:space-between;border-top:1px solid #e8ecf1;margin-top:6px;padding-top:6px"><span style="${bWin?'font-weight:700;color:#087543':''}">${liveIdentity(pb)}</span><strong>${completed?(bWin?'3':m.wo?'0':String(m.loserSets)):'—'}</strong></div>${m.wo?'<span class="tiny">WO</span>':''}</div>`}).join(''):'<p class="muted">Aucun match programmé.</p>'}`}).join('')}</div>`;
 let bracket='';
 if(isSinglePool(x))bracket='<p class="muted">Poule unique : classement final sans tableau éliminatoire.</p>';
 else {
   // Lecture seule : aucune mutation des tours ni des résultats officiels.
   const rounds=x.bracket.length?x.bracket.slice():buildBracket(cat);
   const firstCount=rounds[0]?.length||0;
   const expected=firstCount?Math.log2(firstCount)+1:0;
   let count=firstCount;
   while(rounds.length<expected&&count>1){count=Math.floor(count/2);rounds.push(Array.from({length:count},()=>({a:null,b:null,winner:null,loserSets:null})))}
   const poolSlot=s=>{if(!s)return {label:'BYE',pid:null};if(s.pool===undefined)return {label:s.pid?name(byId(s.pid)):(s.label||'En attente'),pid:s.pid||null};const st=standings(cat,s.pool),p=st.complete&&!st.unresolved?byId(st.rows[s.rank-1]?.pid):null;return {label:(s.label||`${s.rank}e P${s.pool+1}`)+(p?' · '+name(p):' · En attente'),pid:p?.id||null}};
   const hasFinal=Boolean(x.qualValidated&&x.bracket.length&&x.bracket[x.bracket.length-1]?.[0]?.winner);
   const official=Boolean(x.qualValidated);
   const heading=hasFinal?'Tableau final — Terminé':official?'Tableau final officiel':'Tableau prévisionnel';
   const intro=hasFinal?'Compétition terminée : résultats définitifs du tableau final.':official?'Tableau validé : les résultats apparaissent après leur enregistrement.':'Positions théoriques. Les noms sont confirmés au fur et à mesure des poules ; les rencontres restent soumises à validation.';
   const matchHtml=(m,r,i)=>{
     const slot=(side)=>{const src=m[side];if(r===0)return poolSlot(src);const prev=rounds[r-1]?.[2*i+(side==='a'?0:1)];return {label:'Gagnant match '+(2*i+(side==='a'?1:2))+(src?.pid?' · '+name(byId(src.pid)):prev?.winner?' · '+name(byId(prev.winner)):' · En attente'),pid:src?.pid||prev?.winner||null}};
     const a=slot('a'),b=slot('b');
     const completed=Boolean(m.winner&&m.loserSets!==null&&m.loserSets!==undefined);
     const bye=Boolean(m.winner&&!completed&&(!m.a||!m.b));
     const score=(side)=>completed?(m.winner===(side==='a'?a.pid:b.pid)?'3':String(m.loserSets)):'';
     const line=(entry,side)=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;${side==='b'?'border-top:1px solid #e8ecf1;margin-top:6px;padding-top:6px':''}"><span style="${m.winner&&m.winner===entry.pid?'font-weight:700;color:#087543':''}">${entry.pid?liveIdentity(byId(entry.pid)):`<span class="tiny">${esc(entry.label)}</span>`}</span>${completed?`<strong>${score(side)}</strong>`:''}</div>`;
     return `<div style="border:1px solid #d8dfe8;border-radius:8px;padding:9px;margin-bottom:8px"><div class="tiny">Match ${i+1}${completed?' · Terminé':bye?' · BYE':' · En attente'}</div>${line(a,'a')}${line(b,'b')}</div>`;
   };
   const champion=hasFinal?byId(rounds[rounds.length-1][0].winner):null;
   bracket=`<div style="max-width:510px;border:1px solid #ddd;border-radius:12px;padding:12px"><h3>${esc(cat)} — ${heading}</h3><p class="muted">${intro}</p>${champion?`<p><strong>Champion : ${liveIdentity(champion)}</strong></p>`:''}${rounds.map((round,r)=>`<h4>${roundName(r,rounds.length)}</h4>${round.map((m,i)=>matchHtml(m,r,i)).join('')}`).join('')}</div>`;
 }
 return `${chooser}<div style="margin-top:14px">${liveSection==='bracket'?bracket:liveSection==='matches'?matchList:pools}</div>`;
}
function liveView(){const url=new URL(location.href);url.searchParams.set('live','1');const pub=url.href;return `<section class="panel"><h2>FRMTT LIVE — Firebase</h2><p class="muted">La gestion du tournoi reste sauvegardée dans ce navigateur. Seules les catégories dont le tirage est validé, leurs joueurs et leurs résultats sont envoyés dans la publication publique.</p><div class="row"><span class="pill ${firebaseUser?'green':'orange'}">${firebaseUser?'Administrateur connecté':firebaseReady?'Non connecté':'Connexion Firebase en cours'}</span><span class="muted">${esc(firebaseUser?.email||firebaseError||'')}</span></div>${firebaseUser?`<div class="row"><button onclick="publishFirebaseNow()" ${firebasePublishBusy?'disabled':''}>Publier les résultats maintenant</button><label><input type="checkbox" ${autoPublish?'checked':''} onchange="setAutoPublish(this.checked)"> Synchroniser automatiquement après chaque modification</label><button class="secondary" onclick="firebaseLogout()">Déconnexion</button></div>`:`<div class="row firebase-controls"><input id="fbEmail" type="email" autocomplete="username" placeholder="E-mail administrateur"><input id="fbPassword" type="password" autocomplete="current-password" placeholder="Mot de passe"><button onclick="firebaseLogin()" ${!firebaseReady?'disabled':''}>Connexion</button></div>`}<div class="row"><button class="secondary" onclick="copyPublicLiveLink()">Copier le lien LIVE public</button><span class="muted">${esc(pub)}</span></div><p class="muted">${firebasePublishedAt?'Dernière publication depuis cette page : '+esc(firebasePublishedAt):'Aucune publication confirmée pendant cette session.'}</p><p class="note">Avant de diffuser le lien, déployez ce fichier sur GitHub Pages, puis publiez une première fois. Le mode public ne permet aucune saisie.</p></section><section class="panel"><h2>Aperçu local du LIVE</h2>${livePreview()}</section>`}
function publicSnapshot(){const categories={},used=new Set();for(const [cat,x] of Object.entries(state.categories||{})){if(!x.validated||!Array.isArray(x.pools)||!x.pools.length)continue;categories[cat]={validated:true,poolCount:x.pools.length,pools:x.pools,matches:x.matches||[],bracket:x.bracket||[],qualify:x.qualify||2,qualValidated:!!x.qualValidated,qualProvisional:!!x.qualProvisional};for(const pid of x.pools.flat())used.add(pid)}const players=state.players.filter(p=>used.has(p.id)).map(p=>({id:p.id,first:p.first,last:p.last,pl:p.pl,club:p.club,category:p.category,present:true}));const clubs={};players.forEach(p=>clubs[p.club]={confirmed:true});return {meta:{name:state.meta?.name||'',date:state.meta?.date||'',place:state.meta?.place||'',zone:state.meta?.zone||''},players,clubs,categories}}
function renderPublicLive(){document.getElementById('nav').innerHTML='';const app=document.getElementById('app');const status=firebaseError?'<p class="note">'+esc(firebaseError)+'</p>':!firebasePublicLoaded?'<p class="muted">Chargement des résultats en direct…</p>':'';app.innerHTML=`<section class="panel"><h2>${esc(state.meta?.name||'FRMTT · Résultats LIVE')}</h2><p class="muted">${esc([state.meta?.date,state.meta?.place,state.meta?.zone].filter(Boolean).join(' · '))}${firebasePublicUpdated?' · Mise à jour : '+esc(firebasePublicUpdated):''}</p>${status}${firebasePublicLoaded?livePreview():''}</section>`;document.getElementById('saveStatus').textContent='● LIVE public'}
function scheduleFirebasePublish(){clearTimeout(firebasePublishTimer);firebasePublishTimer=setTimeout(()=>{if(autoPublish&&firebaseUser)publishFirebaseNow(true)},900)}
function setAutoPublish(enabled){autoPublish=enabled;localStorage.setItem('frmtt_firebase_auto_publish',enabled?'1':'0');if(enabled&&firebaseUser)scheduleFirebasePublish();render()}
async function publishFirebaseNow(silent=false){if(!firebaseBridge||!firebaseUser){if(!silent)alert('Connectez-vous comme administrateur.');return}if(firebasePublishBusy){scheduleFirebasePublish();return}firebasePublishBusy=true;try{const snapshot=publicSnapshot();await firebaseBridge.publish(snapshot);firebasePublishedAt=new Date().toLocaleString('fr-FR');firebaseError='';if(!silent)alert('Publication LIVE confirmée dans Firestore.')}catch(e){firebaseError='Publication impossible : '+(e?.message||e);if(!silent)alert(firebaseError)}finally{firebasePublishBusy=false;if(tab===8)render()}}
async function firebaseLogin(){if(!firebaseBridge)return alert('Firebase non initialisé.');const email=document.getElementById('fbEmail')?.value.trim(),password=document.getElementById('fbPassword')?.value;if(!email||!password)return alert('Saisissez e-mail et mot de passe.');try{await firebaseBridge.login(email,password)}catch(e){alert('Connexion refusée : '+(e?.message||e))}}
async function firebaseLogout(){if(firebaseBridge)await firebaseBridge.logout()}
function copyPublicLiveLink(){const u=new URL(location.href);u.searchParams.set('live','1');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u.href).then(()=>alert('Lien copié.')).catch(()=>prompt('Copiez le lien public :',u.href));else prompt('Copiez le lien public :',u.href)}

function matchSlip(cat,label,num,a,b){let code='M'+num;return `<article class="slip">${printDocumentHeader()}<div class="slip-head"><span>FRMTT · الجامعة الملكية المغربية لكرة الطاولة</span><span>${esc(cat)} · ${esc(label)} · ${code}</span></div><div class="slip-meta"><span>Arbitre : _________________________</span><span>Table : ______</span></div><table><colgroup><col style="width:32%">${'<col>'.repeat(5)}<col style="width:12%"></colgroup><tr><th>Joueur</th><th>Set 1</th><th>Set 2</th><th>Set 3</th><th>Set 4</th><th>Set 5</th><th>Score global</th></tr><tr><td>${printIdentity(a)}</td>${'<td></td>'.repeat(6)}</tr><tr><td>${printIdentity(b)}</td>${'<td></td>'.repeat(6)}</tr></table><div class="slip-foot"><span>Vainqueur : _______________________</span><span>Signature arbitre : ___________________</span></div></article>`}
function slipSheets(slips){let out='';for(let i=0;i<slips.length;i+=4){out+='<div class="slip-sheet">'+slips.slice(i,i+4).join('')+'</div>'}return out}
function poolRecap(cat,x,i){let pool=x.pools[i],matches=x.matches.filter(m=>m.pool===i);return `<div class="recap">${printDocumentHeader()}<h2>${esc(cat)} · Poule ${i+1}</h2><div class="meta">${pool.length} joueurs · ${matches.length} rencontres</div><div class="section">1. Joueurs engagés</div><table class="players"><tr><th>Nom, prénom</th><th>Licence</th><th>Club</th></tr>${pool.map(pid=>{let p=byId(pid);return `<tr><td><b>${esc(name(p))}</b></td><td>${esc(p?.pl||'')}</td><td>${esc(p?.club||'')}</td></tr>`}).join('')}</table><div class="section">2. Rencontres — cocher uniquement le vainqueur</div><table class="matches"><colgroup><col style="width:9%"><col style="width:30%"><col style="width:7%"><col style="width:8%"><col style="width:8%"><col style="width:7%"><col style="width:31%"></colgroup><tr><th>Match</th><th>Joueur A</th><th></th><th>Sets A</th><th>Sets B</th><th></th><th>Joueur B</th></tr>${matches.map((m,j)=>`<tr><td class="matchcode">M${j+1}</td><td>${printIdentity(byId(m.a))}</td><td class="result-cell"><span class="check-square"></span></td><td class="result-cell"><span class="set-square"></span></td><td class="result-cell"><span class="set-square"></span></td><td class="result-cell"><span class="check-square"></span></td><td>${printIdentity(byId(m.b))}</td></tr>`).join('')}</table><div class="section">3. Classement final de la poule</div><table class="ranking"><colgroup><col style="width:48%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:16%"></colgroup><tr><th>Joueur</th><th>V</th><th>D</th><th>Diff. V/D</th><th>Rang final</th></tr>${pool.map(pid=>`<tr><td>${printIdentity(byId(pid))}</td><td class="rankblank"></td><td></td><td></td><td></td></tr>`).join('')}</table><p class="note">Diff. V/D = victoires − défaites. Les numéros M1, M2… correspondent exactement aux bordereaux individuels. Départages réglementaires à vérifier si nécessaire.</p></div>`}
function printPoolDocuments(){let x=config(category);if(!x.validated||!x.pools.length)return alert('Validez d’abord les affectations des poules.');if(x.pools.some(p=>!p.length))return alert('Une poule est vide. Vérifiez les affectations.');let html='';for(let i=0;i<x.pools.length;i++){let matches=x.matches.filter(m=>m.pool===i),slips=matches.map((m,j)=>matchSlip(category,'Poule '+(i+1),j+1,byId(m.a),byId(m.b)));html+=`<section class="pool-block">${poolRecap(category,x,i)}</section>`+slipSheets(slips)}printWindow('FRMTT - Poules - '+category,html)}
function printBracketRound(){let x=config(category);if(!poolCompletion(category)||!x.qualValidated||x.qualProvisional)return alert('Impression des rencontres officielles bloquée avant validation complète des qualifications.');let r=Number(document.getElementById('printRound')?.value);if(!x.qualValidated)return alert('Validez ou figez les qualifications avant d’imprimer les matchs du tableau final.');let round=x.bracket[r];if(!round)return alert('Tour introuvable.');let ready=round.filter(m=>m.a?.pid&&m.b?.pid);let unresolved=round.filter(m=>(m.a||m.b)&&!(m.a?.pid&&m.b?.pid));if(unresolved.length&&!confirm(unresolved.length+' rencontre(s) de ce tour n’ont pas encore leurs deux adversaires. Imprimer uniquement les '+ready.length+' rencontre(s) connues ?'))return;if(!ready.length)return alert('Aucune rencontre avec deux adversaires connus pour ce tour.');let slips=ready.map(m=>matchSlip(category,roundName(r,x.bracket.length),round.indexOf(m)+1,byId(m.a.pid),byId(m.b.pid)));printWindow('FRMTT - '+roundName(r,x.bracket.length)+' - '+category,slipSheets(slips))}

render();
</script>
